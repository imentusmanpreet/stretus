replicaCount: 1

global:
  imageRegistry: ""

# ── API (FastAPI) ──────────────────────────────────────────────────────────
api:
  image:
    repository: stretus/python-ai-api
    pullPolicy: IfNotPresent
    tag: "65a7807-20260608-191954"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # Long backtests load ~1.3M OHLCV rows into Python lists + DataFrames
      # and then post them to the quant engine. With the old 1 vCPU / 2 GiB
      # limit the pod hit CFS throttling during the sync post-fetch sections
      # (`_dedup_and_sort_records`, JSON serialization) which made the
      # liveness probe time out and K8s killed the pod mid-backtest. 2 vCPU /
      # 4 GiB gives the loop enough headroom that probes always respond.
      cpu: 2000m
      memory: 4Gi
  # Probe against the lightweight async /health route (a 3-key dict return),
  # NOT /docs. /docs renders the OpenAPI schema and was unreliable under load:
  # it competed for the event loop with the in-flight backtest and timed out,
  # triggering pod restarts that killed the in-flight backtest.
  #
  # failureThreshold is intentionally large on liveness so a transient sync
  # CPU section in the backtest doesn't trip a restart — readiness still
  # responds fast enough to pull the pod from the service if it's genuinely
  # stuck.
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

# ── Quant Engine (FastAPI) ─────────────────────────────────────────────────
quant:
  image:
    repository: stretus/python-ai-quant
    pullPolicy: IfNotPresent
    tag: "65a7807-20260608-191954"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  livenessProbe:
    tcpSocket:
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 8001
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Don't auto-mount the k8s API token; this service has no need for it.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Python needs to write ChromaDB data, Alembic tmp files, and strategies;
  # readOnlyRootFilesystem is intentionally false.
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

apiService:
  type: ClusterIP
  port: 8000

quantService:
  type: ClusterIP
  port: 8001

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# ── Persistent storage ─────────────────────────────────────────────────────
persistence:
  chromadb:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  strategies:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

# ── In-cluster market data (backtest OHLCV) ─────────────────────────────────
# gRPC target is built in templates/_helpers.tpl as:
#   <serviceName>.<namespace>.svc.cluster.local:<port>
# Default namespace = Helm release namespace (stretus-ai-dev2 on EKS dev2).
# Same FQDN pattern as BFF / order-execution in stretus-backend.
marketData:
  fetchTransport: grpc
  grpc:
    enabled: true
    serviceName: marketdata-ingestion
    namespace: ""   # empty → .Release.Namespace (stretus-ai-dev2)
    port: 50057
    timeoutSeconds: 120
    secure: false
  httpFallback:
    historicalDataUrl: "https://dev-api.stretus.com"
    timeoutSeconds: 120

# ── Non-sensitive env vars for the API container ───────────────────────────
# All secrets (GROQ_API_KEY, APP_SECRET_KEY, DATABASE_URL, UPSTOX_*)
# are injected via envFrom referencing the k8s Secrets listed below.
# NOTE: MARKET_DATA_GRPC_* is injected by deployment-api.yaml (see marketData above),
# not listed here — so ArgoCD applications that override `env:` still get gRPC.
env:
  - name: APP_ENV
    value: "production"
  - name: APP_DEBUG
    value: "false"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: LLM_PROVIDER
    value: "openrouter"
  - name: USE_GROQ
    value: "false"
  - name: GROQ_MODEL
    value: "llama-3.3-70b-versatile"
  - name: OLLAMA_MODEL
    value: "qwen2.5:7b"
  - name: CHROMA_DB_PATH
    value: "/app/stretus_knowledge_base/data/vector_db"
  - name: STRATEGY_FOLDER
    value: "/app/strategies"
  - name: MARKET_DATA_URL
    value: "https://api.upstox.com/v2"
  - name: MARKET_DATA_CACHE_TTL_SECONDS
    value: "60"
  - name: QUANT_ENGINE_TIMEOUT_SECONDS
    value: "600"
  - name: ROOT_PATH
    value: "/python-ai"
  - name: OPENROUTER_MODEL
    value: "meta-llama/llama-3.3-70b-instruct"
# Secrets referenced by name; created out-of-band via scripts/create-required-secrets.sh.
# postgres-credentials  → POSTGRES_HOST/PORT/DB/USER/PASSWORD (used by entrypoint.sh)
# stretus-ai-credentials → APP_SECRET_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, UPSTOX_*, DATABASE_URL, DATABASE_URL_SYNC
envFrom:
  - secretRef:
      name: postgres-credentials
  - secretRef:
      name: stretus-ai-credentials

# ── Env vars for the Quant Engine container ────────────────────────────────
quantEnv:
  - name: PYTHONUNBUFFERED
    value: "1"

nodeSelector: {}
tolerations: []
affinity: {}

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: dev-api.stretus.com
  tls:
    - hosts:
        - dev-api.stretus.com
      secretName: tls-dev-api-stretus-com
