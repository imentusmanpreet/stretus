apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-ai.fullname" . }}-api
  labels:
    {{- include "python-ai.labels" . | nindent 4 }}
    app.kubernetes.io/subcomponent: api
spec:
  type: {{ .Values.apiService.type }}
  ports:
    - port: {{ .Values.apiService.port }}
      targetPort: http
      name: http
      protocol: TCP
  selector:
    {{- include "python-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/subcomponent: api
