name: price_below_kama
category: trend
direction: bearish
kind: regime
roles:
- entry_trigger
- entry_filter
formula: CLOSE < KAMA({window})
description: Close below Kaufman Adaptive MA — adaptive bearish trend filter.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with: []
contradicts:
- price_above_kama
params_by_timeframe:
  1m:
    window: 30
  3m:
    window: 30
  5m:
    window: 30
  10m:
    window: 30
  15m:
    window: 30
  30m:
    window: 30
  1h:
    window: 30
  1d:
    window: 30
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.6
  breakout: 0.5
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 0.8
match_when:
  phrases:
  - (?:price|close)\s+below\s+kama
  acts_as: entry_trigger
  mirrors_to: price_above_kama
  extract_params:
    window:
      from_group: 1
      default: 14
      kind: int
