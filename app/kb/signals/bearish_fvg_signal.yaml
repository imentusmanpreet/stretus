name: bearish_fvg_signal
category: pattern
direction: bearish
kind: pattern
roles: [entry_trigger, entry_filter]
formula: "IS_BEARISH_FVG > 0"
description: "Bearish Fair Value Gap: 3-bar imbalance where bar i's high < bar (i-2)'s low — institutional aggression to the downside (ICT)."

works_best_on: [5m, 10m, 15m, 30m, 1h]
weak_on: [1m, 3m]
