name: macd_bullish_cross
category: momentum
direction: bullish
kind: crossover
roles:
- entry_trigger
- exit_trigger
- exit_filter
formula: MACD > MACD_SIGNAL AND PREV(MACD, 1) <= PREV(MACD_SIGNAL, 1)
description: MACD line crosses above signal line — bullish momentum trigger.
comparison:
  lhs: macd
  rhs: macd_signal
  op: cross_up
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
  role: entry_trigger
- frequency: very_high
  role: entry_trigger
pairs_well_with:
- price_above_ema
- volume_spike
contradicts:
- macd_bearish_cross
- macd_negative
params_by_timeframe:
  1m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  3m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  5m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  10m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  15m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  30m:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  1h:
    window_fast: 12
    window_slow: 26
    window_sign: 9
  1d:
    window_fast: 12
    window_slow: 26
    window_sign: 9
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.9
  momentum: 1.0
  breakout: 0.6
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 0.7
match_when:
  phrases:
  - macd\s+(?:line\s+)?(?:crosses?|crossed|cross)\s+above\s+signal
  - macd\s+(?:bullish|positive)\s+cross(?:over)?
  - macd\s+up\s+cross
  - macd\s+golden\s+cross
  acts_as: entry_trigger
  mirrors_to: macd_bearish_cross
