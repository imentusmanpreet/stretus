name: macd_bullish_cross
category: momentum
direction: bullish
kind: crossover
roles: [entry_trigger, exit_trigger]
formula: "MACD > 0"
description: "MACD line crosses above signal line — bullish momentum trigger."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish
    role: entry_trigger
  - frequency: very_high
    role: entry_trigger

pairs_well_with: [price_above_ema, volume_spike]
contradicts: [macd_bearish_cross, macd_negative]

params_by_timeframe:
  1m:   {window_fast: 12, window_slow: 26, window_sign: 9}
  3m:   {window_fast: 12, window_slow: 26, window_sign: 9}
  5m:   {window_fast: 12, window_slow: 26, window_sign: 9}
  10m:  {window_fast: 12, window_slow: 26, window_sign: 9}
  15m:  {window_fast: 12, window_slow: 26, window_sign: 9}
  30m:  {window_fast: 12, window_slow: 26, window_sign: 9}
  1h:   {window_fast: 12, window_slow: 26, window_sign: 9}
  1d:   {window_fast: 12, window_slow: 26, window_sign: 9}

experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.9
  momentum: 1.0
  breakout: 0.6
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 0.7
