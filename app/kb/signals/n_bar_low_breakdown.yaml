name: n_bar_low_breakdown
category: pattern
direction: bearish
kind: pattern
roles: [entry_trigger]
formula: "CLOSE < MIN(LOW, {window})"
description: "Close breaks below the lowest low of the prior N bars — Donchian-style range breakdown."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [volume_spike, vwap_bearish, ema_below]
contradicts: [n_bar_high_breakout]

params_by_timeframe:
  1m:   {window: 60}
  3m:   {window: 30}
  5m:   {window: 20}
  10m:  {window: 20}
  15m:  {window: 20}
  30m:  {window: 20}
  1h:   {window: 20}
  1d:   {window: 20}

experience_fit:
  beginner: 0.9
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.7
  momentum: 1.0
  breakout: 1.0
  reversal: 0.0
  scalping: 0.5
  mean_reversion: 0.0
  confirmation: 0.7
