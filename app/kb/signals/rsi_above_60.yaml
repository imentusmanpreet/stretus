name: rsi_above_60
category: momentum
direction: bullish
kind: regime
roles: [entry_trigger, entry_filter, exit_trigger]
formula: "RSI({window}) > {threshold}"
description: "RSI above 60 — tighter bullish-momentum regime than rsi_above_50, picks only the strong-trend half of bullish bars."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish
    role: entry_trigger
  - sentiment: bearish
    role: entry_filter

pairs_well_with: [price_above_ema, ema_above, vwap_bullish, volume_spike, near_52_week_high]
contradicts: [rsi_below_40, rsi_below_50, rsi_overbought]

params_by_timeframe:
  1m:   {window: 14, threshold: 60.0}
  3m:   {window: 14, threshold: 60.0}
  5m:   {window: 14, threshold: 60.0}
  10m:  {window: 14, threshold: 60.0}
  15m:  {window: 14, threshold: 60.0}
  30m:  {window: 14, threshold: 60.0}
  1h:   {window: 14, threshold: 60.0}
  1d:   {window: 14, threshold: 60.0}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.9
  momentum: 1.0
  breakout: 0.9
  reversal: 0.0
  scalping: 0.8
  mean_reversion: 0.0
  confirmation: 1.0
