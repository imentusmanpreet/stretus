name: ema_pullback_bullish
category: trend
direction: bullish
kind: pattern
roles: [entry_trigger]
formula: "CLOSE > EMA({window}) AND MIN(LOW, {lookback}) <= EMA({window}) AND CLOSE > OPEN"
description: "Price was at/below the EMA within the last few bars and is now closing back above — classic trend pullback entry."

works_best_on: [3m, 5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish

pairs_well_with: [volume_spike, ema_above, vwap_bullish, bullish_rejection_candle]
contradicts: [ema_pullback_bearish, price_below_ema]

params_by_timeframe:
  1m:   {window: 20, lookback: 3}
  3m:   {window: 20, lookback: 3}
  5m:   {window: 20, lookback: 3}
  10m:  {window: 20, lookback: 3}
  15m:  {window: 20, lookback: 3}
  30m:  {window: 20, lookback: 3}
  1h:   {window: 34, lookback: 3}
  1d:   {window: 50, lookback: 3}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.5
  reversal: 0.4
  scalping: 0.6
  mean_reversion: 0.5
  confirmation: 0.8
