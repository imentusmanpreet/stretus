name: zscore_oversold
category: momentum
direction: bullish
kind: threshold
roles:
- entry_trigger
formula: ZSCORE(CLOSE, {window}) < {threshold}
description: Close is more than N standard deviations below its rolling mean — quant-style mean-reversion long entry.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- bullish_rejection_candle
- vwap_reclaim_bullish
- rsi_oversold
- atr_low_volatility
contradicts:
- zscore_overbought
params_by_timeframe:
  1m:
    window: 20
    threshold: -2.0
  3m:
    window: 20
    threshold: -2.0
  5m:
    window: 20
    threshold: -2.0
  10m:
    window: 20
    threshold: -2.0
  15m:
    window: 20
    threshold: -2.0
  30m:
    window: 20
    threshold: -2.0
  1h:
    window: 20
    threshold: -2.0
  1d:
    window: 20
    threshold: -2.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.5
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.4
match_when:
  phrases:
  - z[\s\-]*score\s+(?:is\s+)?(?:below|under|<=|<)\s*-?\s*(\d+(?:\.\d+)?)
  - (\d+(?:\.\d+)?)\s+standard\s+deviations?\s+below
  acts_as: entry_trigger
  mirrors_to: zscore_overbought
  extract_params:
    threshold:
      from_group: 1
      default: 2
      kind: float
    window:
      from_group: null
      default: 20
      kind: int
  requires_keyword:
  - z[\s\-]*score|standard\s+deviation
