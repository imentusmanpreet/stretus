name: williams_overbought
category: momentum
direction: bearish
kind: threshold
roles:
- entry_trigger
- exit_trigger
- exit_filter
formula: WILLR({window}) > {threshold}
description: Williams %R near zero — overbought, mean-reversion bearish entry / long exit.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with: []
contradicts:
- williams_oversold
params_by_timeframe:
  1m:
    window: 14
    threshold: -20.0
  3m:
    window: 14
    threshold: -20.0
  5m:
    window: 14
    threshold: -20.0
  10m:
    window: 14
    threshold: -20.0
  15m:
    window: 14
    threshold: -20.0
  30m:
    window: 14
    threshold: -20.0
  1h:
    window: 14
    threshold: -20.0
  1d:
    window: 14
    threshold: -20.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.5
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - williams?\s*%?\s*r\s+overbought
  - '%r\s+(?:above|over)\s*(-?\d+)'
  acts_as: entry_trigger
  mirrors_to: williams_oversold
  extract_params:
    threshold:
      from_group: 1
      default: null
      kind: float
    window:
      from_group: null
      default: 14
      kind: int
