name: stoch_overbought
category: momentum
direction: bearish
kind: threshold
formula: STOCH_K > {threshold}
roles:
- entry_trigger
- entry_filter
description: Stochastic %K above 80 — overbought, bearish reversal candidate.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with:
- vwap_reclaim_bearish
- bearish_rejection_candle
- price_above_bb_upper
contradicts:
- stoch_oversold
params_by_timeframe:
  1m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  3m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  5m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  10m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  15m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  30m:
    window: 14
    smooth_window: 3
    threshold: 80.0
  1h:
    window: 14
    smooth_window: 3
    threshold: 80.0
  1d:
    window: 14
    smooth_window: 3
    threshold: 80.0
experience_fit:
  beginner: 0.9
  intermediate: 1.0
  expert: 0.9
intent_fit:
  trend: 0.2
  momentum: 0.7
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.6
match_when:
  phrases:
  - stoch(?:astic)?\s+(?:is\s+|crosses?\s+|reaches?\s+)?(?:above|over|>=|>)\s*(\d+)
  - stoch(?:astic)?\s+overbought
  acts_as: exit_trigger
  mirrors_to: stoch_oversold
  extract_params:
    threshold:
      from_group: 1
      default: 80
      kind: int
