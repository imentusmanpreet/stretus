name: rsi_cross_up
category: momentum
direction: bullish
kind: crossover
roles: [entry_trigger, exit_trigger]
formula: "RSI({window}) > {threshold}"
description: "RSI crosses above 50 — bullish momentum shift."

works_best_on: [5m, 15m, 30m, 1h, 1d]
weak_on: [1m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish
    role: entry_trigger

pairs_well_with: [price_above_ema, vwap_bullish, volume_spike]
contradicts: [rsi_overbought, rsi_below_50]

params_by_timeframe:
  1m:   {window: 14, threshold: 50.0}
  3m:   {window: 14, threshold: 50.0}
  5m:   {window: 14, threshold: 50.0}
  10m:  {window: 14, threshold: 50.0}
  15m:  {window: 14, threshold: 50.0}
  30m:  {window: 14, threshold: 50.0}
  1h:   {window: 14, threshold: 50.0}
  1d:   {window: 14, threshold: 50.0}

experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.8

intent_fit:
  trend: 0.5
  momentum: 1.0
  breakout: 0.5
  reversal: 0.4
  scalping: 0.7
  mean_reversion: 0.4
  confirmation: 0.5
