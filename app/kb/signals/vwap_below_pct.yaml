name: vwap_below_pct
category: volume
direction: bullish
kind: threshold
roles:
- entry_trigger
formula: (VWAP - CLOSE) / VWAP * 100 >= {threshold}
description: Price has stretched at least N% below VWAP — intraday mean-reversion long that fades the deviation back toward VWAP. Distinct from vwap_zscore_oversold (standard-deviation based); this is a plain percentage distance the trader names directly (e.g. "1.5% below VWAP").
works_best_on:
- 1m
- 3m
- 5m
- 10m
- 15m
- 30m
weak_on: []
unsupported_on:
- 1d
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- bullish_rejection_candle
- rsi_oversold
- volume_spike
contradicts:
- vwap_above_pct
- vwap_bearish
params_by_timeframe:
  1m:
    threshold: 1.0
  3m:
    threshold: 1.0
  5m:
    threshold: 1.0
  10m:
    threshold: 1.0
  15m:
    threshold: 1.0
  30m:
    threshold: 1.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.3
  breakout: 0.0
  reversal: 1.0
  scalping: 0.8
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - price\s+(?:is\s+)?(\d+(?:\.\d+)?)\s*%\s+below\s+(?:the\s+)?vwap
  - (\d+(?:\.\d+)?)\s*%\s+below\s+(?:the\s+)?vwap
  - (\d+(?:\.\d+)?)\s*percent\s+below\s+(?:the\s+)?vwap
  acts_as: entry_trigger
  mirrors_to: vwap_above_pct
  extract_params:
    threshold:
      from_group: 1
      default: 1.0
      kind: float
