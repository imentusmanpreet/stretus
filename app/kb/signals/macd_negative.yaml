name: macd_negative
category: momentum
direction: bearish
kind: regime
roles:
- entry_trigger
- entry_filter
- exit_trigger
- exit_filter
formula: MACD < 0
description: MACD line is below zero — bearish regime; reliable bullish-position exit.
