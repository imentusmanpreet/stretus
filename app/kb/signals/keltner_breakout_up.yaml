name: keltner_breakout_up
category: volatility
direction: bullish
kind: pattern
roles: [entry_trigger]
description: "Price closes above the upper Keltner Channel — strong bullish breakout."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish

pairs_well_with: [bb_squeeze, volume_spike, adx_strong_trend]
contradicts: [keltner_breakout_down]

params_by_timeframe:
  1m:   {window: 20, multiplier: 2.0}
  3m:   {window: 20, multiplier: 2.0}
  5m:   {window: 20, multiplier: 2.0}
  10m:  {window: 20, multiplier: 2.0}
  15m:  {window: 20, multiplier: 2.0}
  30m:  {window: 20, multiplier: 2.0}
  1h:   {window: 20, multiplier: 2.0}
  1d:   {window: 20, multiplier: 2.0}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.7
  momentum: 1.0
  breakout: 1.0
  reversal: 0.0
  scalping: 0.5
  mean_reversion: 0.0
  confirmation: 0.7
