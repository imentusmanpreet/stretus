name: rsi_overbought
category: momentum
direction: bearish
kind: threshold
roles:
- entry_trigger
- exit_trigger
- exit_filter
formula: RSI({window}) > {threshold}
description: RSI above an overbought threshold — bearish reversal setup; common bullish-position exit.
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
  role: entry_trigger
pairs_well_with:
- price_above_bb_upper
contradicts:
- rsi_oversold
- rsi_below_50
params_by_timeframe:
  1m:
    window: 14
    threshold: 70.0
  3m:
    window: 14
    threshold: 70.0
  5m:
    window: 14
    threshold: 70.0
  10m:
    window: 14
    threshold: 70.0
  15m:
    window: 14
    threshold: 70.0
  30m:
    window: 14
    threshold: 70.0
  1h:
    window: 14
    threshold: 70.0
  1d:
    window: 14
    threshold: 70.0
experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 0.9
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - rsi\s+reaches?\s+(?:above|over|>=|>)?\s*(\d{2})
  - (?:exit|sell|close)\b[\s\S]{0,40}\brsi\s+(?:is\s+|crosses?\s+)?(?:above|over|>=|>)\s*(6[5-9]|7\d|8\d|9\d)\b
  - rsi\s+overbought
  acts_as: exit_trigger
  mirrors_to: rsi_oversold
  extract_params:
    threshold:
      from_group: 1
      default: 70
      kind: float
    window:
      from_group: null
      default: 14
      kind: int
