name: supertrend_bullish
category: trend
direction: bullish
kind: regime
roles: [entry_trigger, entry_filter, exit_trigger]
description: "Supertrend bullish — price above the supertrend line. Popular intraday signal in Indian markets."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish
    role: entry_trigger
  - sentiment: bearish
    role: entry_filter

pairs_well_with: [adx_bullish_di, adx_strong_trend, ema_above, vwap_bullish]
contradicts: [supertrend_bearish]

params_by_timeframe:
  1m:   {window: 7, multiplier: 3.0}
  3m:   {window: 7, multiplier: 3.0}
  5m:   {window: 10, multiplier: 3.0}
  10m:  {window: 10, multiplier: 3.0}
  15m:  {window: 10, multiplier: 3.0}
  30m:  {window: 10, multiplier: 3.0}
  1h:   {window: 14, multiplier: 3.0}
  1d:   {window: 14, multiplier: 3.0}

experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 1.0
  momentum: 0.8
  breakout: 0.6
  reversal: 0.0
  scalping: 0.5
  mean_reversion: 0.0
  confirmation: 1.0
