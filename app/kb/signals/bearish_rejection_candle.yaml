name: bearish_rejection_candle
category: pattern
direction: bearish
kind: pattern
roles:
- entry_trigger
- entry_filter
formula: (HIGH - CLOSE) / (HIGH - LOW) > {wick_ratio} AND CLOSE < OPEN
description: 'Shooting-star-style candle: long upper wick rejected by sellers, close in lower portion of range.'
works_best_on:
- 3m
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with:
- vwap_reclaim_bearish
- ema_pullback_bearish
- rsi_overbought
- price_above_bb_upper
contradicts:
- bullish_rejection_candle
params_by_timeframe:
  1m:
    wick_ratio: 0.66
  3m:
    wick_ratio: 0.66
  5m:
    wick_ratio: 0.66
  10m:
    wick_ratio: 0.66
  15m:
    wick_ratio: 0.66
  30m:
    wick_ratio: 0.66
  1h:
    wick_ratio: 0.66
  1d:
    wick_ratio: 0.66
experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.8
intent_fit:
  trend: 0.5
  momentum: 0.7
  breakout: 0.5
  reversal: 1.0
  scalping: 0.7
  mean_reversion: 1.0
  confirmation: 0.8
match_when:
  phrases:
  - bearish\s+rejection\s+candle
  - long[\s\-]*wick\s+up
  - shooting\s+star
  - bearish\s+pin\s*bar
  - rejection\s+candle\s+(?:at|near)\s+(?:resistance|high)
  acts_as: entry_filter
  mirrors_to: bullish_rejection_candle
