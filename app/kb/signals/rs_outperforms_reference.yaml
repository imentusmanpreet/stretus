name: rs_outperforms_reference
category: trend
direction: bullish
kind: threshold
roles:
- entry_filter
tags:
- relative_strength
formula: RS({window}) > {threshold}
description: Stock has outperformed the reference benchmark over the last N bars (relative strength > threshold). Requires reference_symbol on the strategy.
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- price_above_ema
- supertrend_bullish
- ema_above
contradicts:
- rs_underperforms_reference
params_by_timeframe:
  1m:
    window: 30
    threshold: 1.0
  3m:
    window: 30
    threshold: 1.0
  5m:
    window: 30
    threshold: 1.0
  10m:
    window: 30
    threshold: 1.0
  15m:
    window: 20
    threshold: 1.0
  30m:
    window: 20
    threshold: 1.0
  1h:
    window: 20
    threshold: 1.0
  1d:
    window: 20
    threshold: 1.0
experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.9
  breakout: 0.7
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
match_when:
  phrases:
  - outperform(?:s|ing)?\s+(?:nifty|banknifty|reference|benchmark|index)
  - relative\s+strength\s+(?:to|vs)\s+(?:nifty|banknifty|reference|benchmark)
  - stronger\s+than\s+(?:nifty|banknifty|the\s+market)
  acts_as: entry_filter
  mirrors_to: rs_underperforms_reference
