name: zscore_overbought
category: momentum
direction: bearish
kind: threshold
roles: [entry_trigger]
formula: "ZSCORE(CLOSE, {window}) > {threshold}"
description: "Close is more than N standard deviations above its rolling mean — quant-style mean-reversion short entry."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [bearish_rejection_candle, vwap_reclaim_bearish, rsi_overbought, atr_low_volatility]
contradicts: [zscore_oversold]

params_by_timeframe:
  1m:   {window: 20, threshold: 2.0}
  3m:   {window: 20, threshold: 2.0}
  5m:   {window: 20, threshold: 2.0}
  10m:  {window: 20, threshold: 2.0}
  15m:  {window: 20, threshold: 2.0}
  30m:  {window: 20, threshold: 2.0}
  1h:   {window: 20, threshold: 2.0}
  1d:   {window: 20, threshold: 2.0}

experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.0
  momentum: 0.5
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.4
