name: rs_underperforms_reference
category: trend
direction: bearish
kind: threshold
roles: [entry_filter]
formula: "RS({window}) < {threshold}"
description: "Stock has underperformed the reference benchmark over the last N bars (relative strength < threshold). Requires reference_symbol on the strategy."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [price_below_ema, supertrend_bearish, ema_below]
contradicts: [rs_outperforms_reference]

params_by_timeframe:
  1m:   {window: 30, threshold: 1.0}
  3m:   {window: 30, threshold: 1.0}
  5m:   {window: 30, threshold: 1.0}
  10m:  {window: 30, threshold: 1.0}
  15m:  {window: 20, threshold: 1.0}
  30m:  {window: 20, threshold: 1.0}
  1h:   {window: 20, threshold: 1.0}
  1d:   {window: 20, threshold: 1.0}

experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 1.0
  momentum: 0.9
  breakout: 0.7
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
