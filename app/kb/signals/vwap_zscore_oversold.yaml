name: vwap_zscore_oversold
category: volume
direction: bullish
kind: threshold
roles:
- entry_trigger
formula: (CLOSE - VWAP) / STDEV(CLOSE, {window}) < {threshold}
description: Price is more than N standard deviations below VWAP — institutional mean-reversion long entry.
works_best_on:
- 1m
- 3m
- 5m
- 10m
- 15m
- 30m
weak_on: []
unsupported_on:
- 1d
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- vwap_reclaim_bullish
- bullish_rejection_candle
- volume_spike
contradicts:
- vwap_zscore_overbought
params_by_timeframe:
  1m:
    window: 20
    threshold: -2.0
  3m:
    window: 20
    threshold: -2.0
  5m:
    window: 20
    threshold: -2.0
  10m:
    window: 20
    threshold: -2.0
  15m:
    window: 20
    threshold: -2.0
  30m:
    window: 20
    threshold: -2.0
experience_fit:
  beginner: 0.5
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.7
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - vwap\s+(?:z[\s\-]*score|deviation)\s+(?:is\s+|below|<)\s*-?\s*(\d+(?:\.\d+)?)
  - price\s+stretched\s+below\s+vwap
  acts_as: entry_trigger
  mirrors_to: vwap_zscore_overbought
  extract_params:
    threshold:
      from_group: 1
      default: 2
      kind: float
