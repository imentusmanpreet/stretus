name: downtrend_structure
category: trend
direction: bearish
kind: regime
roles: [entry_filter]
formula: "IS_LOWER_LOW > 0"
description: "Most recent confirmed swing low is lower than the previous one — downtrend structure intact (ICT 'LH/LL' read)."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [bearish_market_structure_break, ema_pullback_bearish, supertrend_bearish]
contradicts: [uptrend_structure]

params_by_timeframe:
  1m:   {}
  3m:   {}
  5m:   {}
  10m:  {}
  15m:  {}
  30m:  {}
  1h:   {}
  1d:   {}

experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.6
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
