name: ultosc_overbought
category: momentum
direction: bearish
kind: threshold
roles:
- entry_trigger
- exit_filter
formula: ULTOSC > {threshold}
description: Ultimate Oscillator overbought — bearish entry / long exit.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with: []
contradicts:
- ultosc_oversold
params_by_timeframe:
  1m:
    threshold: 70.0
  3m:
    threshold: 70.0
  5m:
    threshold: 70.0
  10m:
    threshold: 70.0
  15m:
    threshold: 70.0
  30m:
    threshold: 70.0
  1h:
    threshold: 70.0
  1d:
    threshold: 70.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.5
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - ultimate\s+oscillator\s+overbought
  - ultosc\s+(?:above|over)\s*(\d+)
  acts_as: entry_trigger
  mirrors_to: ultosc_oversold
  extract_params:
    threshold:
      from_group: 1
      default: 70
      kind: float
