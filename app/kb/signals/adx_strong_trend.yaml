name: adx_strong_trend
category: trend
direction: neutral
kind: threshold
formula: ADX({window}) > {threshold}
roles:
- entry_filter
description: ADX above threshold — strong trend present (either direction). Use as a regime filter.
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when: []
pairs_well_with:
- ema_above
- ema_below
- supertrend_bullish
- supertrend_bearish
contradicts: []
params_by_timeframe:
  1m:
    window: 14
    threshold: 20.0
  3m:
    window: 14
    threshold: 20.0
  5m:
    window: 14
    threshold: 25.0
  10m:
    window: 14
    threshold: 25.0
  15m:
    window: 14
    threshold: 25.0
  30m:
    window: 14
    threshold: 25.0
  1h:
    window: 14
    threshold: 25.0
  1d:
    window: 14
    threshold: 25.0
experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.5
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
match_when:
  phrases:
  - adx\s*(?:>|>=|≥|above|over)\s*(\d+)
  - adx\s+(?:is\s+)?(?:strong|strongly\s+trending)
  - strong\s+(?:adx\s+)?trend
  - avoid\b[\s\S]{0,40}\b(?:sideways|range[\s\-]+bound|chop(?:py)?|consolidation)
  - (?:only|prefer)\b[\s\S]{0,20}\btrend(?:ing|s)?\b
  - trend(?:ing)?\s+(?:only|filter|markets?)
  acts_as: entry_filter
  extract_params:
    threshold:
      from_group: 1
      default: 25
      kind: int
    window:
      from_group: null
      default: 14
      kind: int
