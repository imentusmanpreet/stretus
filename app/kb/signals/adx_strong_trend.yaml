name: adx_strong_trend
category: trend
direction: neutral
kind: threshold
roles: [entry_filter]
description: "ADX above threshold — strong trend present (either direction). Use as a regime filter."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when: []

pairs_well_with: [ema_above, ema_below, supertrend_bullish, supertrend_bearish]
contradicts: []

params_by_timeframe:
  1m:   {window: 14, threshold: 20.0}
  3m:   {window: 14, threshold: 20.0}
  5m:   {window: 14, threshold: 25.0}
  10m:  {window: 14, threshold: 25.0}
  15m:  {window: 14, threshold: 25.0}
  30m:  {window: 14, threshold: 25.0}
  1h:   {window: 14, threshold: 25.0}
  1d:   {window: 14, threshold: 25.0}

experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.5
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
