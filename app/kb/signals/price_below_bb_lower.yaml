name: price_below_bb_lower
category: volatility
direction: bearish
kind: threshold
roles: [entry_trigger]
formula: "CLOSE < BB_LOWER({window})"
description: "Price closes below the lower Bollinger Band — bearish breakout."

works_best_on: [5m, 15m, 30m, 1h, 1d]
weak_on: [1m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish
    role: entry_trigger

pairs_well_with: [volume_spike, vwap_bearish]
contradicts: [price_above_bb_upper, rsi_overbought]

params_by_timeframe:
  1m:   {window: 20, window_dev: 2}
  3m:   {window: 20, window_dev: 2}
  5m:   {window: 20, window_dev: 2}
  10m:  {window: 20, window_dev: 2}
  15m:  {window: 20, window_dev: 2}
  30m:  {window: 20, window_dev: 2}
  1h:   {window: 20, window_dev: 2}
  1d:   {window: 20, window_dev: 2}

experience_fit:
  beginner: 0.6
  intermediate: 0.9
  expert: 1.0

intent_fit:
  trend: 0.6
  momentum: 1.0
  breakout: 1.0
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 0.4
