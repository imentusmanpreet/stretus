name: vwap_reclaim_bearish
category: volume
direction: bearish
kind: crossover
roles: [entry_trigger]
formula: "CLOSE < VWAP AND PREV(CLOSE, 1) >= VWAP"
description: "Price closes below VWAP after the prior bar held it — institutional rejection event."

works_best_on: [1m, 3m, 5m, 10m, 15m, 30m]
weak_on: []
unsupported_on: [1d]

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [volume_spike, rsi_overbought, bearish_rejection_candle]
contradicts: [vwap_reclaim_bullish, vwap_bullish]

params_by_timeframe:
  1m:   {}
  3m:   {}
  5m:   {}
  10m:  {}
  15m:  {}
  30m:  {}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.4
  momentum: 0.8
  breakout: 0.6
  reversal: 1.0
  scalping: 1.0
  mean_reversion: 1.0
  confirmation: 0.7
