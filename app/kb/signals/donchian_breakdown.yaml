name: donchian_breakdown
category: trend
direction: bearish
kind: regime
roles:
- entry_trigger
formula: CLOSE < DONCHIAN_LOWER({window})
description: Close breaks below the prior n-bar low (Donchian lower) — bearish breakdown.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with: []
contradicts:
- donchian_breakout_up
params_by_timeframe:
  1m:
    window: 20
  3m:
    window: 20
  5m:
    window: 20
  10m:
    window: 20
  15m:
    window: 20
  30m:
    window: 20
  1h:
    window: 20
  1d:
    window: 20
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.7
  momentum: 0.6
  breakout: 1.0
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 0.4
match_when:
  phrases:
  - donchian\s+breakdown
  - breaks?\s+(?:below\s+)?(?:the\s+)?(\d+)[\s-]*(?:bar|day|period)\s+low
  acts_as: entry_trigger
  mirrors_to: donchian_breakout_up
  extract_params:
    window:
      from_group: 1
      default: 14
      kind: int
