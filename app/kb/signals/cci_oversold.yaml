name: cci_oversold
category: momentum
direction: bullish
kind: threshold
formula: CCI({window}) < {threshold}
roles:
- entry_trigger
- entry_filter
description: Commodity Channel Index below -100 — oversold, bullish reversal candidate.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- vwap_reclaim_bullish
- bullish_rejection_candle
- price_below_bb_lower
contradicts:
- cci_overbought
params_by_timeframe:
  1m:
    window: 20
    threshold: -100.0
  3m:
    window: 20
    threshold: -100.0
  5m:
    window: 20
    threshold: -100.0
  10m:
    window: 20
    threshold: -100.0
  15m:
    window: 20
    threshold: -100.0
  30m:
    window: 20
    threshold: -100.0
  1h:
    window: 20
    threshold: -100.0
  1d:
    window: 20
    threshold: -100.0
experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.2
  momentum: 0.7
  breakout: 0.0
  reversal: 1.0
  scalping: 0.5
  mean_reversion: 1.0
  confirmation: 0.6
match_when:
  phrases:
  - cci\s+(?:is\s+|crosses?\s+|reaches?\s+)?(?:below|under|<=|<)\s*-?(\d+)
  - cci\s+oversold
  acts_as: entry_trigger
  mirrors_to: cci_overbought
  extract_params:
    threshold:
      from_group: 1
      default: 100
      kind: int
