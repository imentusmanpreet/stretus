name: rsi_below_50
category: momentum
direction: bearish
kind: regime
roles: [entry_trigger, entry_filter, exit_trigger]
formula: "RSI({window}) < {threshold}"
description: "RSI is below 50 (bearish momentum regime). Reliable exit for bullish positions; works on any bar."

works_best_on: [1m, 3m, 5m, 10m, 15m, 30m, 1h, 1d]
weak_on: []
unsupported_on: []

contraindicated_when:
  - sentiment: bullish
    role: entry_trigger
  - sentiment: bullish
    role: entry_filter

pairs_well_with: [price_below_ema, ema_below, vwap_bearish, volume_spike]
contradicts: [rsi_above_50, rsi_oversold]

params_by_timeframe:
  1m:   {window: 14, threshold: 50.0}
  3m:   {window: 14, threshold: 50.0}
  5m:   {window: 14, threshold: 50.0}
  10m:  {window: 14, threshold: 50.0}
  15m:  {window: 14, threshold: 50.0}
  30m:  {window: 14, threshold: 50.0}
  1h:   {window: 14, threshold: 50.0}
  1d:   {window: 14, threshold: 50.0}

experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 0.7
  momentum: 1.0
  breakout: 0.5
  reversal: 0.2
  scalping: 1.0
  mean_reversion: 0.2
  confirmation: 0.8
