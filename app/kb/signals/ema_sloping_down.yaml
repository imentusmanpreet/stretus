name: ema_sloping_down
category: trend
direction: bearish
kind: threshold
roles: [entry_filter]
formula: "EMA({window}) < PREV(EMA({window}), {lookback})"
description: "EMA is falling — required for downtrend-following entries to confirm the trend has negative slope."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [ema_pullback_bearish, price_below_ema, supertrend_bearish, adx_strong_trend]
contradicts: [ema_sloping_up]

params_by_timeframe:
  1m:   {window: 20, lookback: 5}
  3m:   {window: 20, lookback: 5}
  5m:   {window: 20, lookback: 3}
  10m:  {window: 20, lookback: 3}
  15m:  {window: 20, lookback: 3}
  30m:  {window: 20, lookback: 3}
  1h:   {window: 34, lookback: 3}
  1d:   {window: 50, lookback: 3}

experience_fit:
  beginner: 0.9
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.5
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 1.0
