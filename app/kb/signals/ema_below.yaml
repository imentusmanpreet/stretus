name: ema_below
category: trend
direction: bearish
kind: regime
roles: [entry_trigger, entry_filter, exit_trigger]
formula: "EMA({window_fast}) < EMA({window_slow})"
description: "Fast EMA is below slow EMA (downtrend regime). Stateless-eval friendly; valid exit for bullish positions."

works_best_on: [1m, 3m, 5m, 10m, 15m, 30m, 1h, 1d]
weak_on: []
unsupported_on: []

contraindicated_when:
  - sentiment: bullish
    role: entry_trigger
  - sentiment: bullish
    role: entry_filter

pairs_well_with: [price_below_ema, vwap_bearish, volume_spike]
contradicts: [ema_above, price_above_ema]

params_by_timeframe:
  1m:   {window_fast: 5,  window_slow: 13}
  3m:   {window_fast: 5,  window_slow: 13}
  5m:   {window_fast: 9,  window_slow: 21}
  10m:  {window_fast: 9,  window_slow: 21}
  15m:  {window_fast: 9,  window_slow: 21}
  30m:  {window_fast: 9,  window_slow: 21}
  1h:   {window_fast: 12, window_slow: 26}
  1d:   {window_fast: 12, window_slow: 26}

experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.8

intent_fit:
  trend: 1.0
  momentum: 0.8
  breakout: 0.5
  reversal: 0.0
  scalping: 0.7
  mean_reversion: 0.1
  confirmation: 0.9
