name: adx_bullish_di
category: trend
direction: bullish
kind: threshold
roles: [entry_filter, entry_trigger]
description: "DI+ above DI- — bulls in control of the directional movement."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish

pairs_well_with: [adx_strong_trend, ema_above, supertrend_bullish]
contradicts: [adx_bearish_di]

params_by_timeframe:
  1m:   {window: 14}
  3m:   {window: 14}
  5m:   {window: 14}
  10m:  {window: 14}
  15m:  {window: 14}
  30m:  {window: 14}
  1h:   {window: 14}
  1d:   {window: 14}

experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 1.0
  momentum: 0.8
  breakout: 0.6
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 0.9
