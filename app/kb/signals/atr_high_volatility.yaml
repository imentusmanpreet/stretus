name: atr_high_volatility
category: volatility
direction: neutral
kind: threshold
formula: ATR({window}) > AVG(ATR({window}), 50)
roles:
- entry_filter
description: ATR significantly above its own moving average — high-volatility regime.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when: []
pairs_well_with:
- n_bar_high_breakout
- n_bar_low_breakdown
- opening_range_breakout
contradicts:
- bb_squeeze
- atr_low_volatility
params_by_timeframe:
  1m:
    window: 14
    multiplier: 1.3
  3m:
    window: 14
    multiplier: 1.3
  5m:
    window: 14
    multiplier: 1.5
  10m:
    window: 14
    multiplier: 1.5
  15m:
    window: 14
    multiplier: 1.5
  30m:
    window: 14
    multiplier: 1.5
  1h:
    window: 14
    multiplier: 1.5
  1d:
    window: 14
    multiplier: 1.5
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.6
  momentum: 1.0
  breakout: 1.0
  reversal: 0.5
  scalping: 0.7
  mean_reversion: 0.4
  confirmation: 0.8
match_when:
  phrases:
  - high\s+(?:realised\s+|realized\s+)?volatility
  - atr\s+(?:is\s+|expanding|surges?|spikes?)
  - volatile\s+(?:market|regime)
  - high[\s\-]*atr
  acts_as: entry_filter
  mirrors_to: atr_low_volatility
