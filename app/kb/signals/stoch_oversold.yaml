name: stoch_oversold
category: momentum
direction: bullish
kind: threshold
roles: [entry_trigger, entry_filter]
description: "Stochastic %K below 20 — oversold, bullish reversal candidate."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish

pairs_well_with: [vwap_reclaim_bullish, bullish_rejection_candle, price_below_bb_lower]
contradicts: [stoch_overbought]

params_by_timeframe:
  1m:   {window: 14, smooth_window: 3, threshold: 20.0}
  3m:   {window: 14, smooth_window: 3, threshold: 20.0}
  5m:   {window: 14, smooth_window: 3, threshold: 20.0}
  10m:  {window: 14, smooth_window: 3, threshold: 20.0}
  15m:  {window: 14, smooth_window: 3, threshold: 20.0}
  30m:  {window: 14, smooth_window: 3, threshold: 20.0}
  1h:   {window: 14, smooth_window: 3, threshold: 20.0}
  1d:   {window: 14, smooth_window: 3, threshold: 20.0}

experience_fit:
  beginner: 0.9
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 0.2
  momentum: 0.7
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.6
