name: aroon_bullish
category: trend
direction: bullish
kind: regime
roles:
- entry_trigger
- entry_filter
formula: AROONOSC({window}) > {threshold}
description: Aroon oscillator strongly positive — recent highs dominate, bullish trend.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with: []
contradicts:
- aroon_bearish
params_by_timeframe:
  1m:
    window: 14
    threshold: 50.0
  3m:
    window: 14
    threshold: 50.0
  5m:
    window: 14
    threshold: 50.0
  10m:
    window: 14
    threshold: 50.0
  15m:
    window: 14
    threshold: 50.0
  30m:
    window: 14
    threshold: 50.0
  1h:
    window: 14
    threshold: 50.0
  1d:
    window: 14
    threshold: 50.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.6
  breakout: 0.5
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 0.8
match_when:
  phrases:
  - aroon\s+(?:bullish|up)
  - aroon\s+oscillator\s+(?:above|>)\s*(\d+)
  acts_as: entry_trigger
  mirrors_to: aroon_bearish
  extract_params:
    threshold:
      from_group: 1
      default: null
      kind: float
    window:
      from_group: null
      default: 14
      kind: int
