name: rsi_oversold
category: momentum
direction: bullish
kind: threshold
roles: [entry_trigger, exit_trigger]
formula: "RSI({window}) < {threshold}"
description: "RSI below an oversold threshold — mean-reversion bullish entry."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish
    role: entry_trigger

pairs_well_with: [price_below_bb_lower, volume_dry_up]
contradicts: [rsi_overbought, rsi_above_50]

params_by_timeframe:
  1m:   {window: 14, threshold: 30.0}
  3m:   {window: 14, threshold: 30.0}
  5m:   {window: 14, threshold: 30.0}
  10m:  {window: 14, threshold: 30.0}
  15m:  {window: 14, threshold: 30.0}
  30m:  {window: 14, threshold: 30.0}
  1h:   {window: 14, threshold: 30.0}
  1d:   {window: 14, threshold: 30.0}

experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.4
  mean_reversion: 1.0
  confirmation: 0.5
