name: mfi_overbought
category: momentum
direction: bearish
kind: threshold
roles: [entry_trigger, entry_filter]
description: "Money Flow Index above threshold — volume-weighted overbought reading."

works_best_on: [5m, 10m, 15m, 30m, 1h, 1d]
weak_on: [1m, 3m]
unsupported_on: []

contraindicated_when:
  - sentiment: bullish

pairs_well_with: [vwap_reclaim_bearish, bearish_rejection_candle, price_above_bb_upper]
contradicts: [mfi_oversold]

params_by_timeframe:
  1m:   {window: 14, threshold: 80.0}
  3m:   {window: 14, threshold: 80.0}
  5m:   {window: 14, threshold: 80.0}
  10m:  {window: 14, threshold: 80.0}
  15m:  {window: 14, threshold: 80.0}
  30m:  {window: 14, threshold: 80.0}
  1h:   {window: 14, threshold: 80.0}
  1d:   {window: 14, threshold: 80.0}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.2
  momentum: 0.7
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.7
