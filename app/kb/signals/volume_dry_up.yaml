name: volume_dry_up
category: volume
direction: neutral
kind: threshold
roles:
- entry_filter
formula: VOL < AVG(VOL, {window})
description: Volume below its rolling average — a dry-up / contraction often preceding a move.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when: []
pairs_well_with:
- inside_bar
- rsi_oversold
contradicts:
- volume_spike
- volume_above_average
param_specs:
  window:
    type: int
    default: 20
    min: 2
    max: 400
    violation_action: note
engine:
  kind: filter
  anchors_supported: []
params_by_timeframe:
  1m:
    window: 20
  3m:
    window: 20
  5m:
    window: 20
  10m:
    window: 20
  15m:
    window: 20
  30m:
    window: 20
  1h:
    window: 20
  1d:
    window: 20
experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.4
  momentum: 0.3
  breakout: 0.7
  reversal: 0.6
  scalping: 0.5
  mean_reversion: 0.7
  confirmation: 0.8
match_when:
  phrases:
  - volume\s+dry(?:ing)?[\s\-]*up
  - (?:low|declining|contracting|below[\s\-]+average)\s+volume
  - volume\s+contraction
  acts_as: entry_filter
  extract_params:
    window:
      from_group: null
      default: 20
      kind: int
