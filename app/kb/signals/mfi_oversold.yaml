name: mfi_oversold
category: momentum
direction: bullish
kind: threshold
formula: MFI({window}) < {threshold}
roles:
- entry_trigger
- entry_filter
description: Money Flow Index below threshold — volume-weighted oversold reading.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- vwap_reclaim_bullish
- bullish_rejection_candle
- price_below_bb_lower
contradicts:
- mfi_overbought
params_by_timeframe:
  1m:
    window: 14
    threshold: 20.0
  3m:
    window: 14
    threshold: 20.0
  5m:
    window: 14
    threshold: 20.0
  10m:
    window: 14
    threshold: 20.0
  15m:
    window: 14
    threshold: 20.0
  30m:
    window: 14
    threshold: 20.0
  1h:
    window: 14
    threshold: 20.0
  1d:
    window: 14
    threshold: 20.0
experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.2
  momentum: 0.7
  breakout: 0.0
  reversal: 1.0
  scalping: 0.6
  mean_reversion: 1.0
  confirmation: 0.7
match_when:
  phrases:
  - mfi\s+(?:is\s+|crosses?\s+|reaches?\s+)?(?:below|under|<=|<)\s*(\d+)
  - mfi\s+oversold
  - money\s+flow\s+(?:index\s+)?(?:below|<)\s*(\d+)
  acts_as: entry_trigger
  mirrors_to: mfi_overbought
  extract_params:
    threshold:
      from_group: 1
      default: 20
      kind: int
