name: adxr_strong_trend
category: trend
direction: neutral
kind: regime
roles:
- entry_filter
formula: ADXR({window}) > {threshold}
description: ADXR above threshold — sustained trend strength (either direction). Regime filter.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when: []
pairs_well_with:
- ema_above
- supertrend_bullish
contradicts: []
params_by_timeframe:
  1m:
    window: 14
    threshold: 25.0
  3m:
    window: 14
    threshold: 25.0
  5m:
    window: 14
    threshold: 25.0
  10m:
    window: 14
    threshold: 25.0
  15m:
    window: 14
    threshold: 25.0
  30m:
    window: 14
    threshold: 25.0
  1h:
    window: 14
    threshold: 25.0
  1d:
    window: 14
    threshold: 25.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.6
  breakout: 0.5
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 0.8
match_when:
  phrases:
  - adxr\s+(?:>|>=|above|over)\s*(\d+)
  - adxr\s+strong
  acts_as: entry_filter
  extract_params:
    threshold:
      from_group: 1
      default: null
      kind: float
    window:
      from_group: null
      default: 14
      kind: int
