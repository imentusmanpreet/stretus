name: obv_falling
category: volume
direction: bearish
kind: threshold
formula: OBV < PREV(OBV, 1)
roles:
- entry_filter
description: On-Balance Volume trending down — distribution by smart money.
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with:
- price_below_ema
- ema_below
- vwap_bearish
- n_bar_low_breakdown
contradicts:
- obv_rising
params_by_timeframe:
  1m:
    window: 10
  3m:
    window: 10
  5m:
    window: 10
  10m:
    window: 10
  15m:
    window: 10
  30m:
    window: 10
  1h:
    window: 10
  1d:
    window: 10
experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 1.0
  momentum: 0.7
  breakout: 0.6
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.0
  confirmation: 1.0
match_when:
  phrases:
  - obv\s+(?:is\s+)?(?:falling|negative|declining|trending\s+down)
  - on[\s\-]+balance\s+volume\s+(?:falling|negative|declining)
  acts_as: entry_filter
  mirrors_to: obv_rising
