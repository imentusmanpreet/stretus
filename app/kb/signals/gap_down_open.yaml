name: gap_down_open
category: india
direction: bearish
kind: pattern
roles: [entry_trigger, exit_trigger]
formula: "OPEN < PREV(CLOSE, 1) * {gap_factor}"
description: "Today's open is significantly below yesterday's close — gap-down. Valid bullish-position exit."

works_best_on: [1m, 3m, 5m, 15m, 30m]
weak_on: []
unsupported_on: [1d]

contraindicated_when:
  - sentiment: bullish
    role: entry_trigger
  - frequency: very_high
    role: entry_trigger

pairs_well_with: [vwap_bearish, volume_spike]
contradicts: [gap_up_open]

params_by_timeframe:
  1m:   {gap_pct: 0.5}
  3m:   {gap_pct: 0.5}
  5m:   {gap_pct: 0.5}
  10m:  {gap_pct: 0.5}
  15m:  {gap_pct: 0.5}
  30m:  {gap_pct: 0.5}
  1h:   {gap_pct: 0.5}

experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0

intent_fit:
  trend: 0.4
  momentum: 1.0
  breakout: 1.0
  reversal: 0.0
  scalping: 0.5
  mean_reversion: 0.0
  confirmation: 0.4
