name: rsi_below_40
category: momentum
direction: bearish
kind: regime
roles:
- entry_trigger
- entry_filter
- exit_trigger
- exit_filter
formula: RSI({window}) < {threshold}
description: RSI below 40 — tighter bearish-momentum regime than rsi_below_50, picks only the strong-downtrend half of bearish bars.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
  role: entry_trigger
- sentiment: bullish
  role: entry_filter
pairs_well_with:
- price_below_ema
- ema_below
- vwap_bearish
- volume_spike
- near_52_week_low
contradicts:
- rsi_above_60
- rsi_above_50
- rsi_oversold
params_by_timeframe:
  1m:
    window: 14
    threshold: 40.0
  3m:
    window: 14
    threshold: 40.0
  5m:
    window: 14
    threshold: 40.0
  10m:
    window: 14
    threshold: 40.0
  15m:
    window: 14
    threshold: 40.0
  30m:
    window: 14
    threshold: 40.0
  1h:
    window: 14
    threshold: 40.0
  1d:
    window: 14
    threshold: 40.0
experience_fit:
  beginner: 0.8
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.9
  momentum: 1.0
  breakout: 0.9
  reversal: 0.0
  scalping: 0.8
  mean_reversion: 0.0
  confirmation: 1.0
match_when:
  phrases:
  - rsi\s+(?:is\s+|crosses?\s+)?(?:below|under|<)\s*40\b
  - rsi\s+<\s*40
  - weak\s+rsi
  acts_as: entry_filter
  mirrors_to: rsi_above_60
  extract_params:
    threshold:
      from_group: null
      default: 40
      kind: int
    window:
      from_group: null
      default: 14
      kind: int
