name: adx_bearish_di
category: trend
direction: bearish
kind: threshold
formula: MINUS_DI({window}) > PLUS_DI({window})
roles:
- entry_filter
- entry_trigger
description: DI- above DI+ — bears in control of the directional movement.
works_best_on:
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bullish
pairs_well_with:
- adx_strong_trend
- ema_below
- supertrend_bearish
contradicts:
- adx_bullish_di
params_by_timeframe:
  1m:
    window: 14
  3m:
    window: 14
  5m:
    window: 14
  10m:
    window: 14
  15m:
    window: 14
  30m:
    window: 14
  1h:
    window: 14
  1d:
    window: 14
experience_fit:
  beginner: 0.7
  intermediate: 1.0
  expert: 0.9
intent_fit:
  trend: 1.0
  momentum: 0.8
  breakout: 0.6
  reversal: 0.0
  scalping: 0.4
  mean_reversion: 0.0
  confirmation: 0.9
match_when:
  phrases:
  - adx\s+bearish
  - -di\s+(?:above|crosses?\s+above|>)\s*\+di
  - -di\s*>\s*\+di
  - adx\s+(?:short|sell)\s+(?:setup|signal)
  - directional\s+index\s+(?:turns?\s+)?bearish
  acts_as: entry_filter
  mirrors_to: adx_bullish_di
