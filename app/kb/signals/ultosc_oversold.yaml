name: ultosc_oversold
category: momentum
direction: bullish
kind: threshold
roles:
- entry_trigger
- exit_filter
formula: ULTOSC < {threshold}
description: Ultimate Oscillator oversold — multi-timeframe bullish mean-reversion entry.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with: []
contradicts:
- ultosc_overbought
params_by_timeframe:
  1m:
    threshold: 30.0
  3m:
    threshold: 30.0
  5m:
    threshold: 30.0
  10m:
    threshold: 30.0
  15m:
    threshold: 30.0
  30m:
    threshold: 30.0
  1h:
    threshold: 30.0
  1d:
    threshold: 30.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.5
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - ultimate\s+oscillator\s+oversold
  - ultosc\s+(?:below|under)\s*(\d+)
  acts_as: entry_trigger
  mirrors_to: ultosc_overbought
  extract_params:
    threshold:
      from_group: 1
      default: 30
      kind: float
