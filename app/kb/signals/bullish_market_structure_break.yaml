name: bullish_market_structure_break
category: pattern
direction: bullish
kind: pattern
roles:
- entry_trigger
formula: IS_BOS_BULLISH > 0
description: Close breaks above the most recent confirmed swing high — institutional intent to go higher (ICT 'Break of Structure').
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
- 3m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with:
- bullish_fvg_signal
- volume_spike
- vwap_bullish
- uptrend_structure
contradicts:
- bearish_market_structure_break
params_by_timeframe:
  1m: {}
  3m: {}
  5m: {}
  10m: {}
  15m: {}
  30m: {}
  1h: {}
  1d: {}
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.7
  momentum: 1.0
  breakout: 1.0
  reversal: 0.3
  scalping: 0.6
  mean_reversion: 0.0
  confirmation: 1.0
match_when:
  phrases:
  - bullish\s+market\s+structure\s+(?:break|shift)
  - market\s+structure\s+(?:turns?\s+)?bullish
  - market\s+structure\s+break\b[\s\S]{0,30}(?:upside|up|long|bullish)
  - break\s+of\s+(?:bearish\s+)?structure
  - \bms[bs]\s+(?:bullish|long)
  acts_as: entry_trigger
  mirrors_to: bearish_market_structure_break
