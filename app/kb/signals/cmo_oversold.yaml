name: cmo_oversold
category: momentum
direction: bullish
kind: threshold
roles:
- entry_trigger
- exit_filter
formula: CMO({window}) < {threshold}
description: Chande Momentum Oscillator oversold — bullish mean-reversion entry.
works_best_on:
- 5m
- 10m
- 15m
- 30m
- 1h
- 1d
weak_on:
- 1m
unsupported_on: []
contraindicated_when:
- sentiment: bearish
pairs_well_with: []
contradicts:
- cmo_overbought
params_by_timeframe:
  1m:
    window: 14
    threshold: -50.0
  3m:
    window: 14
    threshold: -50.0
  5m:
    window: 14
    threshold: -50.0
  10m:
    window: 14
    threshold: -50.0
  15m:
    window: 14
    threshold: -50.0
  30m:
    window: 14
    threshold: -50.0
  1h:
    window: 14
    threshold: -50.0
  1d:
    window: 14
    threshold: -50.0
experience_fit:
  beginner: 0.6
  intermediate: 1.0
  expert: 1.0
intent_fit:
  trend: 0.0
  momentum: 0.4
  breakout: 0.0
  reversal: 1.0
  scalping: 0.5
  mean_reversion: 1.0
  confirmation: 0.5
match_when:
  phrases:
  - cmo\s+oversold
  - chande\s+momentum\s+oversold
  acts_as: entry_trigger
  mirrors_to: cmo_overbought
  extract_params:
    threshold:
      from_group: 1
      default: null
      kind: float
    window:
      from_group: null
      default: 14
      kind: int
