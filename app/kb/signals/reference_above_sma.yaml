name: reference_above_sma
category: trend
direction: bullish
kind: regime
roles: [entry_filter]
tags: [relative_strength]
formula: "REF_CLOSE > AVG(REF_CLOSE, {window})"
description: "Reference benchmark (e.g. Nifty 50) is above its N-period SMA — broad-market uptrend filter. Requires reference_symbol on the strategy."

works_best_on: [15m, 30m, 1h, 1d]
weak_on: [1m, 3m, 5m]
unsupported_on: []

contraindicated_when:
  - sentiment: bearish

pairs_well_with: [price_above_ema, ema_above, supertrend_bullish, rs_outperforms_reference]
contradicts: [reference_below_sma]

params_by_timeframe:
  1m:   {window: 50}
  3m:   {window: 50}
  5m:   {window: 50}
  10m:  {window: 50}
  15m:  {window: 50}
  30m:  {window: 50}
  1h:   {window: 50}
  1d:   {window: 50}

experience_fit:
  beginner: 1.0
  intermediate: 1.0
  expert: 0.9

intent_fit:
  trend: 1.0
  momentum: 0.6
  breakout: 0.5
  reversal: 0.0
  scalping: 0.3
  mean_reversion: 0.2
  confirmation: 1.0
