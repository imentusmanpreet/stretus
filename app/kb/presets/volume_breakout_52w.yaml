name: volume_breakout_52w
display_name: Volume-Spike 52-Week Breakout (Intraday)
description: |
  Intraday breakout strategy: enters when today's volume is ≥ 2× its 20-bar
  average, price is above VWAP and EMA(20), pullback to EMA was shallow,
  RSI shows strong momentum, AND the daily timeframe confirms price is
  within 2% of the 52-week high. Bearish leg is the mirror image — near
  the 52-week low with sub-50 RSI weakness.

  Exits use an ATR(14) × 1.5 stop with a 1:2 risk:reward target and a
  0.5%-distance trailing stop that activates once the trade is up 1%.
  Holding period is capped to one full NSE session (75 × 5m bars), so
  intraday positions can't carry overnight.

keywords:
  - volume breakout
  - volume spike breakout
  - 52 week breakout
  - 52w breakout
  - 52-week breakout
  - 52-week high breakout
  - 52-week low breakdown
  - intraday volume breakout
  - relative volume breakout

supported_timeframes: [5m, 10m, 15m, 30m]

bullish:
  entry_trigger: ema_pullback_bullish
  entry_filters:
    - volume_spike
    - vwap_bullish
    - rsi_above_60
  exit_trigger: price_below_ema
  htf:
    - timeframe: 1d
      condition: "CLOSE >= MAX(HIGH, 252) * 0.98"     # within 2% of 52w high

bearish:
  entry_trigger: ema_pullback_bearish
  entry_filters:
    - volume_spike
    - vwap_bearish
    - rsi_below_40
  exit_trigger: price_above_ema
  htf:
    - timeframe: 1d
      condition: "CLOSE <= MIN(LOW, 252) * 1.02"      # within 2% of 52w low

stop_loss:
  type: atr
  multiplier: 1.5
  window: 14

trailing_stop:
  type: percent
  distance_pct: 0.5
  activate_after_pct: 1.0

# Wall-clock cutoff (Phase 8b). Any open position is force-closed at the
# first bar whose IST time is at or after 15:15, and new entries are
# blocked past that point. NSE closes at 15:30, so this leaves a 15-min
# buffer that avoids the volatile last quarter-hour.
time_exit:
  exit_time: "15:15"
  timezone:  "Asia/Kolkata"
