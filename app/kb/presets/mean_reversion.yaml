name: mean_reversion
display_name: Mean Reversion
description: |
  Quant-style mean reversion: enters when the close is N standard deviations
  away from its rolling mean (Z-score) and the move is confirmed by an
  oversold/overbought RSI plus a rejection candle. Exits when price rejoins
  the mean (RSI flips).

keywords:
  - mean reversion
  - mean revert
  - bb reversion
  - bollinger reversion
  - oversold bounce
  - overbought fade
  - z-score
  - zscore mean reversion

supported_timeframes: [5m, 10m, 15m, 30m, 1h, 1d]

bullish:
  entry_trigger: zscore_oversold
  entry_filters:
    - rsi_oversold
    - bullish_rejection_candle
  exit_trigger: rsi_overbought

bearish:
  entry_trigger: zscore_overbought
  entry_filters:
    - rsi_overbought
    - bearish_rejection_candle
  exit_trigger: rsi_oversold
