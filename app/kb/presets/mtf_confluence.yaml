name: mtf_confluence
display_name: Multi-Timeframe Confluence
description: |
  Aligns three timeframes for high-probability trades. The 15m entry trigger
  only fires when the 1h trend agrees AND the daily trend agrees. Standard
  swing-trader pattern: macro trend on the daily, local momentum on the 1h,
  precision execution on the 15m. The simulator strictly uses the most
  recently CLOSED HTF bar — no look-ahead.

keywords:
  - mtf
  - mtf confluence
  - multi-timeframe
  - multi timeframe
  - higher timeframe confluence
  - htf confluence

supported_timeframes: [15m, 30m]

bullish:
  entry_trigger: ema_pullback_bullish
  entry_filters:
    - volume_spike
  exit_trigger: price_below_ema
  htf:
    - timeframe: 1h
      condition: "EMA(20) > EMA(50)"     # 1h trend up
    - timeframe: 1d
      condition: "CLOSE > EMA(50)"        # daily trend up

bearish:
  entry_trigger: ema_pullback_bearish
  entry_filters:
    - volume_spike
  exit_trigger: price_above_ema
  htf:
    - timeframe: 1h
      condition: "EMA(20) < EMA(50)"     # 1h trend down
    - timeframe: 1d
      condition: "CLOSE < EMA(50)"        # daily trend down
