name: relative_strength
display_name: Relative Strength vs Nifty
description: |
  Buys stocks that are outperforming the broad market. Requires the Nifty 50
  benchmark series to be fetched alongside the trade symbol so RS(n) and
  REF_CLOSE evaluate correctly. The thesis: "money rotates into strength" —
  align with the leading sectors and stocks during a confirmed broad-market
  uptrend, fade when both stock and benchmark are weak together.

keywords:
  - relative strength
  - rs strategy
  - rs vs nifty
  - relative strength strategy
  - rs momentum

# This preset is a FILTER/MODIFIER, not a primary strategy framework.
# It must not be promoted as the base framework when the KB keyword scorer
# detects it alongside primary framework keywords (e.g. "ORB with RS filter").
is_primary_framework: false

supported_timeframes: [15m, 30m, 1h, 1d]

reference_symbol: ^NSEI

bullish:
  entry_trigger: ema_cross_up
  entry_filters:
    - rs_outperforms_reference
    - reference_above_sma
  exit_trigger: ema_cross_down

bearish:
  entry_trigger: ema_cross_down
  entry_filters:
    - rs_underperforms_reference
    - reference_below_sma
  exit_trigger: ema_cross_up
