name: trend_following
display_name: Trend Following
description: |
  Classic CTA-style trend following: enter in the direction of an established
  trend confirmed by Supertrend, ADX strength, and price above/below the EMA
  stack. Exits on a Supertrend flip.

keywords:
  - trend following
  - trend follow
  - trend strategy
  - cta strategy

supported_timeframes: [15m, 30m, 1h, 1d]

bullish:
  entry_trigger: supertrend_bullish
  entry_filters:
    - price_above_ema
    - adx_strong_trend
  exit_trigger: supertrend_bearish

bearish:
  entry_trigger: supertrend_bearish
  entry_filters:
    - price_below_ema
    - adx_strong_trend
  exit_trigger: supertrend_bullish
