name: smart_money
display_name: Smart Money / Liquidity Grab
description: |
  ICT-style structural read of the market. Enters when price breaks the most
  recent confirmed swing high (Break of Structure → bullish intent), confirmed
  by a Bullish Fair Value Gap (institutional aggression that often gets
  revisited) and an HH/HL trend structure. Exits on the opposite BOS.

  Convention: structural patterns are confirmed `swing_window` bars after the
  pivot — so signals fire when you would actually act on them, not at the
  pivot itself. Strict no-look-ahead.

keywords:
  - smart money
  - smc
  - ict
  - liquidity grab
  - liquidity sweep
  - market structure break
  - bos strategy
  - order flow

supported_timeframes: [5m, 10m, 15m, 30m, 1h, 1d]

bullish:
  entry_trigger: bullish_market_structure_break
  entry_filters:
    - bullish_fvg_signal
    - uptrend_structure
  exit_trigger: bearish_market_structure_break

bearish:
  entry_trigger: bearish_market_structure_break
  entry_filters:
    - bearish_fvg_signal
    - downtrend_structure
  exit_trigger: bullish_market_structure_break
