# Supported timeframes for the planner. Adding a new one is a YAML edit.
supported: [1m, 3m, 5m, 10m, 15m, 30m, 1h, 1d]

# Coarse buckets used for ranking and quick lookups.
buckets:
  short_intraday: [1m, 3m, 5m]
  intraday:       [10m, 15m, 30m]
  swing:          [1h]
  positional:     [1d]

# Free-text → canonical mapping. Used by user_input_interpreter.
# Keys must be lowercase. Add freely; the planner picks the canonical id only.
synonyms:
  "1m":          1m
  "1 m":         1m
  "1 min":       1m
  "1 mis":       1m
  "1 minute":    1m
  "3m":          3m
  "3 min":       3m
  "5m":          5m
  "5 min":       5m
  "5 minute":    5m
  "10m":         10m
  "10 min":      10m
  "15m":         15m
  "15 min":      15m
  "15 minute":   15m
  "30m":         30m
  "30 min":      30m
  "30 minute":   30m
  "1h":          1h
  "1 hour":      1h
  "hourly":      1h
  "1d":          1d
  "1 day":       1d
  "daily":       1d
  "eod":         1d
